name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format-check:
    runs-on: ubuntu-latest
    name: Code Formatting Check
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format
    
    - name: Create config.h from example
      run: cp src/config.example.h src/config.h
    
    - name: Check code formatting
      run: |
        # Run clang-format on all source files and check if any files would be changed
        find src include -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.c" 2>/dev/null | while read file; do
          if [ -f "$file" ]; then
            if ! clang-format --dry-run --Werror "$file" > /dev/null 2>&1; then
              echo "❌ $file is not properly formatted"
              echo "To fix formatting issues, run: ./scripts/fix-lint.sh"
              exit 1
            else
              echo "✅ $file is properly formatted"
            fi
          fi
        done

  lint:
    runs-on: ubuntu-latest
    name: Static Code Analysis
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install static analysis tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck clang-tools
    
    - name: Create config.h from example
      run: cp src/config.example.h src/config.h
    
    - name: Run cppcheck static analysis
      run: |
        echo "Running cppcheck static analysis..."
        cppcheck --enable=warning,performance,portability --std=c++11 --platform=unix32 \
          --suppress=missingIncludeSystem \
          --suppress=unmatchedSuppression \
          --suppress=useStlAlgorithm \
          --error-exitcode=1 \
          --verbose \
          --include=src/config.h \
          src/ include/ 2>&1 | tee cppcheck-results.txt
        
        # Store the exit code
        CPPCHECK_EXIT=$?
        
        # Also run a full analysis for informational purposes (style issues)
        echo "Running full cppcheck analysis for informational purposes..."
        cppcheck --enable=all --std=c++11 --platform=unix32 \
          --suppress=missingIncludeSystem \
          --suppress=unmatchedSuppression \
          --suppress=useStlAlgorithm \
          --suppress=unusedFunction \
          --suppress=constVariableReference \
          --suppress=unreadVariable \
          --suppress=noExplicitConstructor \
          --verbose \
          --include=src/config.h \
          src/ include/ 2>&1 | tee cppcheck-full-results.txt || true
        
        # Only fail on serious issues (warnings, performance, portability)
        if [ $CPPCHECK_EXIT -ne 0 ]; then
          echo "❌ Static analysis found serious issues"
          exit 1
        else
          echo "✅ Static analysis passed (no critical issues found)"
        fi
    
    - name: Run additional static analysis
      run: |
        echo "Running additional static analysis checks..."
        
        # Check for common code quality issues
        echo "Checking for TODO/FIXME comments..."
        grep -rn "TODO\|FIXME" src/ include/ 2>/dev/null || echo "No TODO/FIXME comments found"
        
        # Check for potential debug code
        echo "Checking for debug statements..."
        grep -rn "Serial.println.*debug\|Serial.print.*debug" src/ 2>/dev/null | grep -v "//.*debug" || echo "No debug statements found"
        
        echo "✅ Additional static analysis completed"

  build:
    runs-on: ubuntu-latest
    name: Build Check
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache PlatformIO
      uses: actions/cache@v3
      with:
        path: |
          ~/.platformio/.cache
          ~/.platformio/penv
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-
    
    - name: Install PlatformIO Core
      run: pip install --upgrade platformio
    
    - name: Show PlatformIO version
      run: pio --version
    
    - name: Create config.h from example
      run: cp src/config.example.h src/config.h
    
    - name: Build project
      run: pio run --environment esp32-c6-devkitc-1 --verbose